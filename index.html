<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="to_do.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div id="todo">
        <div class="heading">
            <h1>My To-Do List</h1>
            <p>Keep track of what needs to get done.</p>
        </div>
        <div id="input_area">
            <input
                type="text"
                id="input_box"
                placeholder="Add your task here..."
                autocomplete="off"
            >
            <button id="insert">Add Task</button>
        </div>
        <div id="task_container">
            <ul id="tasks_list"></ul>
        </div>
        <button id="task_completed">Clear Completed</button>
    </div>
    <script src="to_do.js"></script>
</body>
</html>
